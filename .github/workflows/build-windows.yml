name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install "pyinstaller>=6.10"

      - name: Tests
        # 5 golden-тестов исключены только на Windows: эталоны сняты на Linux (DejaVu),
        # а на Windows текст рисуется системным Arial -> попиксельные различия в тексте.
        # Решение Контролёра, этап 11. Linux-джоб удалён 2026-11-10 (решение Ивана: целевая система Windows), golden в CI больше не проверяются.
        # test_open_save_close_not_dirty: временно, известный баг WinError 32 (решение Архитектора, 2026-11-10).
        run: >-
          python -m pytest -v -rA --durations=20
          -o faulthandler_timeout=60
          --deselect "tests/test_render.py::test_golden[front_full]"
          --deselect "tests/test_render.py::test_golden[front_no_photo]"
          --deselect "tests/test_render.py::test_golden[back]"
          --deselect "tests/test_stage10.py::test_stage10_golden[barcode_code128]"
          --deselect "tests/test_stage10.py::test_stage10_golden[barcode_ean13]"
          --deselect "tests/test_project_session.py::test_open_save_close_not_dirty"

      - name: Upload golden actual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual
          path: tests/_golden_actual/
          if-no-files-found: ignore

      - name: UI screenshots (remarks)
        # QA: без continue-on-error — зелёный прогон означает, что снимки сняты
        if: always()
        run: python ui/qa_screens.py

      - name: Upload screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: reports/screens/
          if-no-files-found: error

      - name: Build (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/badge_generator.spec

      - name: Check bundled Qt plugins/DLLs (camera, print, jpeg)
        shell: pwsh
        run: |
          $m = "dist\BadgeGenerator.bundle.txt"
          if (-not (Test-Path $m)) { throw "$m not produced by spec" }
          Get-Content $m
          # OPTIONAL-MISSING (напр. plugins/printsupport в PyQt6-Qt6 6.12) — не ошибка (D49)
          $miss = Get-Content $m | Where-Object { $_ -like "MISSING*" }
          if ($miss) { throw "Qt files missing in BadgeGenerator.exe: $($miss -join '; ')" }
          # D47: каскад, cv2 и фото self-test обязаны быть в exe
          foreach ($req in @("cv2/data/haarcascade_frontalface_default.xml", "cv2", "badge_backend/assets/selftest_face.jpg")) {
            if (-not (Get-Content $m | Where-Object { $_ -like "FOUND`t$req`t*" })) { throw "required in bundle: $req" }
          }
          # Замечание №1 (onedir): exe, Qt6PrintSupport.dll и assets/ рядом с exe — проверка по файлам папки
          $app = "dist\BadgeGenerator"
          if (-not (Test-Path "$app\BadgeGenerator.exe")) { throw "$app\BadgeGenerator.exe not built (onedir)" }
          if (-not (Test-Path "dist\BadgeSmoke\BadgeSmoke.exe")) { throw "dist\BadgeSmoke\BadgeSmoke.exe not built (onedir)" }
          $ps = Get-ChildItem -Path $app -Recurse -Filter "Qt6PrintSupport.dll" -File | Select-Object -First 1
          if (-not $ps) { throw "Qt6PrintSupport.dll not found in $app" }
          Write-Host "Qt6PrintSupport.dll: $($ps.FullName)"
          foreach ($req in @("assets\smartid\reference.csd", "assets\fonts\DejaVuSans.ttf")) {
            if (-not (Test-Path "$app\$req")) { throw "required next to exe: $app\$req" }
          }

      - name: Zip app folder
        # Замечание №1: артефакт — zip всей папки dist/BadgeGenerator (exe + _internal + assets).
        # Делается ДО запуска exe в смоук-шагах, чтобы в архив не попали созданные ими work/, import/, logs/.
        shell: pwsh
        run: Compress-Archive -Path dist\BadgeGenerator -DestinationPath dist\BadgeGenerator-win64.zip -Force

      - name: Smoke test (backend exe)
        shell: pwsh
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          .\dist\BadgeSmoke\BadgeSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "BadgeSmoke failed: $LASTEXITCODE" }

      - name: Smoke test (GUI exe starts and stays up)
        shell: pwsh
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata-gui"
          $p = Start-Process -FilePath .\dist\BadgeGenerator\BadgeGenerator.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "BadgeGenerator.exe exited early, code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          # Замечание №1 (доп.): БД exe по умолчанию — рядом с exe, dist\BadgeGenerator\projects\project.db (не %APPDATA%)
          if (-not (Test-Path "dist\BadgeGenerator\projects\project.db")) { throw "project.db not created in dist\BadgeGenerator\projects" }
          if (Test-Path "$env:APPDATA\BadgeGenerator\project.db") { throw "project.db must not be created in %APPDATA%\BadgeGenerator any more" }

      - name: Smoke test (old %APPDATA% DB is copied next to exe, original kept)
        # Замечание №1 (доп.): в новом месте БД нет, в старом %APPDATA%\BadgeGenerator есть → копия (не перенос).
        # Корень программы подменён через BG_APP_ROOT, чтобы не трогать dist\BadgeGenerator.
        shell: pwsh
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata-migr"
          $env:BG_APP_ROOT = "$env:RUNNER_TEMP\approot-migr"
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\BadgeGenerator\photos" | Out-Null
          Copy-Item "dist\BadgeGenerator\projects\project.db" "$env:APPDATA\BadgeGenerator\project.db"
          Set-Content -Path "$env:APPDATA\BadgeGenerator\photos\marker.txt" -Value "x"
          $p = Start-Process -FilePath .\dist\BadgeGenerator\BadgeGenerator.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "BadgeGenerator.exe exited early, code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path "$env:BG_APP_ROOT\projects\project.db")) { throw "old DB was not copied to BG_APP_ROOT\projects" }
          if (-not (Test-Path "$env:BG_APP_ROOT\projects\photos\marker.txt")) { throw "photos\ was not copied with the DB" }
          if (-not (Test-Path "$env:APPDATA\BadgeGenerator\project.db")) { throw "old DB must be kept (copy, not move)" }

      - name: Self-test (GUI exe --self-test)
        # Контракт (Frontend, ui/self_test.py): BadgeGenerator.exe --self-test --log <path>
        #   сценарий — ui/qa_click_all.py (встроен в exe; от reports/qa/* сборка не зависит), лог — <path>
        #   по умолчанию (без --log): app_paths.logs_dir()/self_test.log — рядом с exe: dist\BadgeGenerator\logs\
        #   (изоляция самотеста: BG_APP_ROOT внутри процесса); watchdog Frontend 170 c; 0 — успех, !=0 — провал.
        #   Таймаут 180 c -> провал job. Шаг выполняется всегда (без условия): нет хука -> job падает.
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata-selftest"
          $logs = Join-Path (Resolve-Path .\dist\BadgeGenerator) "logs"
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $log = Join-Path $logs "self_test.log"
          if (-not (Select-String -Path main.py -Pattern '--self-test' -SimpleMatch -Quiet)) { throw "main.py has no --self-test hook (Frontend)" }
          $p = Start-Process -FilePath .\dist\BadgeGenerator\BadgeGenerator.exe -ArgumentList '--self-test','--log',"`"$log`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force
            throw "self-test timeout (180 s)"
          }
          if (Test-Path $log) { Get-Content $log -Tail 200 } else { Write-Warning "self-test log not found: $log" }
          if ($p.ExitCode -ne 0) { throw "self-test failed, exit code $($p.ExitCode)" }

      - name: Upload self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: |
            dist/BadgeGenerator/logs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: BadgeGenerator
          path: dist/BadgeGenerator-win64.zip
          if-no-files-found: error
