name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-linux:
    # Полный прогон, включая golden-тесты (эталоны сняты на Linux со шрифтом DejaVu).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System libs
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (full, with golden)
        run: python -m pytest -q

  build:
    needs: tests-linux
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install "pyinstaller>=6.10"

      - name: Tests
        # 5 golden-тестов исключены только на Windows: эталоны сняты на Linux (DejaVu),
        # а на Windows текст рисуется системным Arial -> попиксельные различия в тексте.
        # Golden проверяются в job tests-linux. Решение Контролёра, этап 11.
        run: >-
          python -m pytest -q
          --deselect "tests/test_render.py::test_golden[front_full]"
          --deselect "tests/test_render.py::test_golden[front_no_photo]"
          --deselect "tests/test_render.py::test_golden[back]"
          --deselect "tests/test_stage10.py::test_stage10_golden[barcode_code128]"
          --deselect "tests/test_stage10.py::test_stage10_golden[barcode_ean13]"

      - name: Build (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/badge_generator.spec

      - name: Smoke test (backend exe)
        shell: pwsh
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          .\dist\BadgeSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "BadgeSmoke failed: $LASTEXITCODE" }

      - name: Smoke test (GUI exe starts and stays up)
        shell: pwsh
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata-gui"
          $p = Start-Process -FilePath .\dist\BadgeGenerator.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "BadgeGenerator.exe exited early, code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path "$env:APPDATA\BadgeGenerator\project.db")) { throw "project.db not created in %APPDATA%\BadgeGenerator" }

      - uses: actions/upload-artifact@v4
        with:
          name: BadgeGenerator
          path: dist/BadgeGenerator.exe
          if-no-files-found: error
